name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - '.dvc/config'
      - 'src/**'
      - 'tests/**'
      - 'deploy/**'
      - 'requirements.txt'
      - 'params.yaml'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: income-production
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull training data from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
          MLFLOW_ARTIFACT_ROOT: ./mlartifacts
        run: python src/train.py
      - name: Read report
        id: read_report
        run: |
          python - <<'PY'
          import json, os
          report = json.load(open('outputs/report.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"f1={report['f1_score']}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/model.joblib
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json
          if-no-files-found: error

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Require positive-class F1 >= 0.65
        env:
          F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PY'
          import math, os
          f1 = float(os.environ['F1'])
          if not math.isfinite(f1) or not 0.65 <= f1 <= 1:
              raise SystemExit(f'FAILED: f1_score={f1}; deployment blocked')
          print(f'PASSED: f1_score={f1:.6f}')
          PY

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      - name: Upload approved model
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: aws s3 cp models/model.joblib "s3://$ARTIFACT_BUCKET/artifacts/current/model.joblib"
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/income_deploy
          chmod 600 ~/.ssh/income_deploy
          cp deploy/known_hosts ~/.ssh/known_hosts
      - name: Deploy API and check health
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          scp -i ~/.ssh/income_deploy -o BatchMode=yes src/serve.py "$SERVER_USER@$SERVER_HOST:income-api/src/serve.py"
          scp -i ~/.ssh/income_deploy -o BatchMode=yes deploy/income-api.service "$SERVER_USER@$SERVER_HOST:income-api/income-api.service"
          ssh -i ~/.ssh/income_deploy -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" 'bash -se' <<'REMOTE'
          sudo install -m 644 ~/income-api/income-api.service /etc/systemd/system/income-api.service
          sudo systemctl daemon-reload
          sudo systemctl enable income-api
          sudo systemctl restart income-api
          for attempt in $(seq 1 12); do
            if curl -fsS http://localhost:8080/healthz; then
              exit 0
            fi
            sleep 5
          done
          sudo journalctl -u income-api -n 40 --no-pager
          exit 1
          REMOTE
      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/income_deploy
